image: ghcr.io/cirruslabs/flutter:stable

stages:
  - build
  - deploy

variables:
  GIT_STRATEGY: clone

before_script:
  - flutter --version
  - flutter pub get

build_web:
  stage: build
  script:
    - flutter build web --release --base-href "/$CI_PROJECT_NAME/"
  artifacts:
    paths:
      - build/web
    expire_in: 1 week

deploy_pages:
  stage: deploy
  needs:
    - build_web
  script:
    - cp -r build/web public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'